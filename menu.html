<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Heirloom Express Cafe - Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; background: #fcf8f2; font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <header class="bg-amber-950 text-white py-4 px-6 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold font-serif">The Heirloom Express Cafe Menu</h1>
        <a href="menu.pdf" download class="bg-orange-600 hover:bg-orange-700 text-white text-xs uppercase font-bold py-2 px-4 rounded-full transition-colors">
            📥 Download PDF
        </a>
    </header>

    <main class="flex-1 w-full bg-gray-100 flex items-center justify-center p-4">
        <!-- Native browser PDF embed that opens and displays inside the web browser -->
        <object data="menu.pdf" type="application/pdf" class="w-full h-full rounded-2xl shadow-inner border border-amber-200">
            <!-- Fallback if the browser doesn't support inline PDF viewing -->
            <div class="flex flex-col items-center justify-center h-full text-center p-6 bg-white rounded-2xl">
                <p class="text-gray-700 text-lg mb-4">Your browser doesn't support embedded PDFs.</p>
                <a href="menu.pdf" target="_blank" class="bg-amber-900 text-white px-6 py-3 rounded-full font-bold uppercase text-sm shadow hover:bg-amber-800 transition-colors">
                    Click here to open or download the PDF Menu
                </a>
            </div>
        </object>
    </main>

</body>
</html>
