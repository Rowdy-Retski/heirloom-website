<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heirloom Express Cafe — Menu</title>
<style>
  :root{
    --bg: #e5e4e1;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
  }

  .page{
    position:relative;
    width:100%;
    min-height:100vh;
    padding: 60px 80px;
    border-bottom: 1px solid #cfcdc8;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .page:last-child{ border-bottom:none; }

  .page img {
    max-width: 100%;
    max-height: 100vh;
    height: auto;
    display: block;
    object-fit: contain;
  }

  @media (max-width: 900px){
    .page{ padding: 40px 24px; }
  }
</style>
</head>
<body>

<!-- ============ PAGE 1 : TITLE ============ -->
<section class="page">
  <img src="/images/menu/1.png" alt="Heirloom Express Cafe Title Page">
</section>

<!-- ============ PAGE 2 : COFFEES & ESPRESSO ============ -->
<section class="page">
  <img src="/images/menu/2.png" alt="Coffees and Espresso Menu">
</section>

<!-- ============ PAGE 3 : SILVER LINE CLASSICS (Espresso & Lattes) ============ -->
<section class="page">
  <img src="/images/menu/3.png" alt="Silver Line Classics - Espresso and Lattes">
</section>

<!-- ============ PAGE 4 : SILVER LINE CLASSICS (Matcha / Macchiato / Chai) ============ -->
<section class="page">
  <img src="/images/menu/4.png" alt="Silver Line Classics - Matcha, Macchiato, and Chai">
</section>

<!-- ============ PAGE 5 : ICED CLASSICS & BREWS (Shaken / Cold Brew / Frozen) ============ -->
<section class="page">
  <img src="/images/menu/5.png" alt="Iced Classics and Brews">
</section>

<!-- ============ PAGE 6 : ICED CLASSICS & BREWS (Midnight Express / Iron Route) ============ -->
<section class="page">
  <img src="/images/menu/6.png" alt="Iced Classics and Brews - Page 2">
</section>

<!-- ============ PAGE 7 : TEAS & BOTANICALS ============ -->
<section class="page">
  <img src="/images/menu/7.png" alt="Teas and Botanicals Menu">
</section>

<!-- ============ PAGE 8 : TAKE IT HOME ============ -->
<section class="page">
  <img src="/images/menu/8.png" alt="Take It Home Merchandise Menu">
</section>

<!-- ============ PAGE 9 : VITAMIN REFRESHERS MENU ============ -->
<section class="page">
  <img src="/images/menu/9.png" alt="Vitamin Refreshers Menu">
</section>

<!-- ============ PAGE 10 : VITAMIN REFRESHERS - POPULAR LIST ============ -->
<section class="page">
  <img src="/images/menu/10.png" alt="Most Popular Vitamin Refreshers List">
</section>

</body>
</html>
